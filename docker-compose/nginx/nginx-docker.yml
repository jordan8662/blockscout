services:
  nginx:
    image: nginx:latest
    container_name: nginx_static
    ports:
      - "80:80"             # 映射宿主机的80端口到容器的80端口
      - "3001:3001"
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./html:/usr/share/nginx/html:ro   # 挂载静态文件目录 (只读)
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro  # 挂载自定义配置文件
